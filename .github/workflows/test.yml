name: Tests et Couverture de Code

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Configuration Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            shared/package-lock.json
      
      - name: Installation des dépendances
        run: |
          npm ci
          cd shared && npm ci
          cd ../frontend && npm ci
          cd ../backend && npm ci
      
      - name: Build du package shared
        run: |
          cd shared
          npm run build
      
      - name: Vérification des types TypeScript
        run: |
          cd frontend
          npm run typecheck
      
      - name: Linting du code
        run: |
          cd frontend
          npm run lint
      
      - name: Exécution des tests unitaires
        run: |
          cd frontend
          npm run test:coverage
      
      - name: Upload de la couverture vers Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      
      - name: Commentaire PR avec couverture
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./frontend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "Couverture de Code Frontend"
      
      - name: Archivage des rapports de tests
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            frontend/coverage/
            frontend/test-results.xml
          retention-days: 30

  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokemon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Installation des dépendances
        run: |
          npm ci
          cd shared && npm ci
          cd ../backend && npm ci
      
      - name: Build du package shared
        run: |
          cd shared
          npm run build
      
      - name: Configuration de la base de données de test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_test
        run: |
          cd backend
          npm run db:generate
          npm run db:migrate
      
      - name: Tests du backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_test
          JWT_SECRET: test-secret-key-for-ci
          OPENWEATHER_API_KEY: test-api-key
        run: |
          cd backend
          npm test

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Audit de sécurité npm
        run: |
          cd frontend && npm audit --audit-level=moderate
          cd ../backend && npm audit --audit-level=moderate
          cd ../shared && npm audit --audit-level=moderate
      
      - name: Scan des vulnérabilités avec Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Installation des dépendances
        run: |
          npm ci
          cd shared && npm ci
          cd ../frontend && npm ci
          cd ../backend && npm ci
      
      - name: Build complet
        run: npm run build
      
      - name: Test de l'image Docker
        run: |
          docker-compose -f docker-compose.test.yml build
          docker-compose -f docker-compose.test.yml up -d
          sleep 30
          curl -f http://localhost:3000 || exit 1
          docker-compose -f docker-compose.test.yml down

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, security-scan, build-test]
    
    steps:
      - name: Vérification de la qualité
        run: |
          echo "✅ Tous les tests sont passés"
          echo "✅ Scan de sécurité réussi"
          echo "✅ Build réussi"
          echo "🎉 Quality Gate validé !"